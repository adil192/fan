name: Check if the Flutter submodule is up to date
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-flutter-submodule.yml
      - submodules/flutter
  schedule:
    # every 2 weeks at 15:25 (random time to avoid spikes in GitHub Actions usage)
    - cron: "25 15 */14 * *"

jobs:
  check-flutter-submodule:
    name: Check if the Flutter submodule is up to date
    runs-on: ubuntu-slim
    if: ${{ github.repository == 'adil192/fan' }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Check if the Flutter submodule is up to date
        run: dart .github/scripts/check_flutter_submodule.dart
